root /usr/share/nginx/html;
index index.html;

# Güvenlik başlıkları
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
# Tüm JS kendi bundle'ımızdan geliyor, dış kaynak yok. style-src'de
# 'unsafe-inline' gerekiyor: xterm ve recharts satır içi stil üretiyor.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

location / {
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;   # $host portu düşürür, same-origin kontrolü bozuluyordu
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # apt install / apt upgrade gibi işlemler dakikalar sürebiliyor;
    # varsayılan 60 sn'de 504 dönüyordu.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# apt işlemleri backend'de 30 dk'ya kadar sürebiliyor (bkz. packages/routes.js
# APT_TIMEOUT); proxy daha erken keserse istemci 504 alıyor ama işlem arka
# planda sürüyor ve sonucu görünmüyordu.
location /api/packages/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1900s;
    proxy_send_timeout 1900s;
}

location /ws/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;   # $host portu düşürür, same-origin kontrolü bozuluyordu
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400;
}
