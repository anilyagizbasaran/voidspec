# ── Ortak ayarlar ────────────────────────────────────────────────────────────
# Backend 500 MB'a kadar upload kabul ediyor ama nginx'in varsayılan limiti
# 1 MB: büyük dosya yüklemeleri 413 ile sessizce düşüyordu.
client_max_body_size 512m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    include /etc/nginx/snippets/panel-locations.conf;
}

# Self-signed sertifika ile HTTPS (docker-entrypoint.d içinde üretilir).
# Panel root yetkisiyle çalıştığı için oturum çerezinin şifreli kanaldan
# gitmesi önemli; sertifikayı kabul ettikten sonra COOKIE_SECURE=true yapın.
server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/panel.crt;
    ssl_certificate_key /etc/nginx/certs/panel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/panel-locations.conf;
}
